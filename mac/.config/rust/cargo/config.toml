# ==============================================================================
# GLOBAL CARGO CONFIGURATION
# ==============================================================================
# Deliberately minimal. Lint strictness (clippy::pedantic, missing_docs, etc.)
# and warning-as-error policy belong at the project level (workspace
# Cargo.toml [lints] table or a per-project clippy.toml), not injected
# globally into every crate built on this machine.
[build]
# Speeds up local recompilations by avoiding repetitive file flushing.
incremental = true

[term]
color = "always"
progress.when = "always"
progress.width = 80

[net]
retry = 3
git-fetch-with-cli = true
