config-version = 2

after-startup-command = [
    'exec-and-forget borders active_color=0xff7aa2f7 inactive_color=0xff31353d width=4.0 style=round'
]
#start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[gaps]
    inner.horizontal = 8
    inner.vertical   = 0
    outer.left       = 4
    outer.bottom     = 4
    outer.top        = 4
    outer.right      = 4

[key-mapping]
    preset = 'qwerty'

[mode.main.binding]
    # Focus
    alt-ctrl-h = 'focus left'
    alt-ctrl-l = 'focus right'

    # Move/swap windows within layout
    alt-ctrl-shift-h = 'move left'
    alt-ctrl-shift-l = 'move right'

    # Switch workspace
    alt-ctrl-1 = 'workspace 1'
    alt-ctrl-2 = 'workspace 2'
    alt-ctrl-3 = 'workspace 3'
    alt-ctrl-4 = 'workspace 4'
    alt-ctrl-5 = 'workspace 5'
    alt-ctrl-6 = 'workspace 6'
    alt-ctrl-7 = 'workspace 7'
    alt-ctrl-8 = 'workspace 8'
    alt-ctrl-9 = 'workspace 9'

    # Smart Move window to workspace (Prevents gaps)
    alt-ctrl-shift-1 = '''exec-and-forget
        target=1; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-2 = '''exec-and-forget
        target=2; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-3 = '''exec-and-forget
        target=3; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-4 = '''exec-and-forget
        target=4; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-5 = '''exec-and-forget
        target=5; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-6 = '''exec-and-forget
        target=6; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-7 = '''exec-and-forget
        target=7; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-8 = '''exec-and-forget
        target=8; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''
    alt-ctrl-shift-9 = '''exec-and-forget
        target=9; max_active=$(aerospace list-workspaces --all | grep -E '^[0-9]+$' | sort -n | tail -n 1); : ${max_active:=1}; next_allowed=$(( max_active + 1 ))
        if [ "$target" -gt "$next_allowed" ]; then target=$next_allowed; fi; aerospace move-node-to-workspace "$target"
    '''

    # Dynamic cycling through active workspaces only
    alt-ctrl-left  = '''exec-and-forget
        workspaces=($(aerospace list-workspaces --all))
        focused=$(aerospace list-workspaces --focused)
        for i in "${!workspaces[@]}"; do
            if [[ "${workspaces[$i]}" == "$focused" ]]; then
                prev_idx=$(( (i - 1 + ${#workspaces[@]}) % ${#workspaces[@]} ))
                aerospace workspace "${workspaces[$prev_idx]}"
                break
            fi
        done
    '''
    alt-ctrl-right = '''exec-and-forget
        workspaces=($(aerospace list-workspaces --all))
        focused=$(aerospace list-workspaces --focused)
        for i in "${!workspaces[@]}"; do
            if [[ "${workspaces[$i]}" == "$focused" ]]; then
                next_idx=$(( (i + 1) % ${#workspaces[@]} ))
                aerospace workspace "${workspaces[$next_idx]}"
                break
            fi
        done
    '''

    # Float / tile toggle for focused window
    alt-ctrl-f = 'layout floating tiling'

    # Service mode (reset/debug)
    alt-ctrl-space = 'mode service'

[mode.service.binding]
    esc = 'mode main'
    r = ['reload-config', 'mode main']
    f   = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

# All windows float by default
[[on-window-detected]]
    check-further-callbacks = true
    run = 'layout floating'
